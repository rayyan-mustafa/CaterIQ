name: CaterIQ CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Architecture & Search Engine
        env:
          PYTHONPATH: .
        run: |
          python -c "import ai_engine.search.bfs, ai_engine.search.dfs, backend.app.main; print('AI Engine & Backend verified successfully!')"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
