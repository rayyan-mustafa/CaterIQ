version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cateriq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cateriq_user
      POSTGRES_PASSWORD: cateriq_secure_password_2026
      POSTGRES_DB: cateriq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cateriq_user -d cateriq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cateriq-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cateriq_user:cateriq_secure_password_2026@db:5432/cateriq_db
      JWT_SECRET: production-secret-key-cateriq-ai-2026
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cateriq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
